<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url('https://raw.githubusercontent.com/ZeNZxyn/Zen-HtmlXD/refs/heads/main/ZenCover.jpg') center center / cover no-repeat fixed;
  }

  /* subtle dark overlay so the glass bar pops against any image */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
    z-index: 0;
  }

  /* floating liquid blobs of light for extra "glassy/liquidy" feel */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    z-index: 1;
    animation: float 12s ease-in-out infinite;
  }
  .blob1 {
    width: 300px; height: 300px;
    background: rgba(255,255,255,0.5);
    top: -80px; left: -80px;
    animation-delay: 0s;
  }
  .blob2 {
    width: 250px; height: 250px;
    background: rgba(180,220,255,0.4);
    bottom: -60px; right: -60px;
    animation-delay: 3s;
  }
  .blob3 {
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.3);
    bottom: 20%; left: 10%;
    animation-delay: 6s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -30px) scale(1.08); }
  }

  .glass-wrap {
    position: relative;
    z-index: 2;
    animation: rise 1.1s cubic-bezier(0.19, 1, 0.22, 1);
  }

  .glass-bar {
    position: relative;
    padding: 54px 64px;
    max-width: 90vw;
    text-align: center;
    isolation: isolate;
    overflow: hidden;

    background: linear-gradient(
      165deg,
      rgba(255,255,255,0.35) 0%,
      rgba(255,255,255,0.10) 12%,
      rgba(255,255,255,0.06) 50%,
      rgba(255,255,255,0.14) 88%,
      rgba(255,255,255,0.30) 100%
    );

    border-radius: 42px;
    border: 1px solid rgba(255,255,255,0.55);

    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);

    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.45),
      0 2px 8px rgba(0, 0, 0, 0.25),
      inset 0 1.5px 1px rgba(255, 255, 255, 0.85),
      inset 0 -1.5px 2px rgba(255, 255, 255, 0.15),
      inset 0 0 40px rgba(255, 255, 255, 0.06);

    animation: breathe 5s ease-in-out infinite;
  }

  /* top specular highlight arc, like iOS liquid glass */
  .glass-bar::before {
    content: "";
    position: absolute;
    top: -40%;
    left: 8%;
    width: 84%;
    height: 60%;
    background: radial-gradient(
      ellipse at top,
      rgba(255,255,255,0.55) 0%,
      rgba(255,255,255,0.12) 45%,
      rgba(255,255,255,0) 75%
    );
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  /* moving liquid shine sweep across the glass */
  .glass-bar::after {
    content: "";
    position: absolute;
    top: 0; left: -160%;
    width: 55%;
    height: 100%;
    background: linear-gradient(
      115deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.35) 50%,
      rgba(255,255,255,0) 100%
    );
    transform: skewX(-18deg);
    animation: shine 6s ease-in-out infinite;
    z-index: 0;
    pointer-events: none;
  }

  .glass-bar > * {
    position: relative;
    z-index: 1;
  }

  /* rim edge light to sell the refractive glass edge */
  .glass-rim {
    position: absolute;
    inset: 0;
    border-radius: 42px;
    padding: 1px;
    background: linear-gradient(
      160deg,
      rgba(255,255,255,0.9),
      rgba(255,255,255,0.05) 30%,
      rgba(255,255,255,0.05) 70%,
      rgba(255,255,255,0.6)
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 2;
  }

  @keyframes shine {
    0%   { left: -160%; }
    45%  { left: 160%; }
    100% { left: 160%; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes breathe {
    0%, 100% {
      box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.25),
        inset 0 1.5px 1px rgba(255,255,255,0.85),
        inset 0 -1.5px 2px rgba(255,255,255,0.15),
        inset 0 0 40px rgba(255,255,255,0.06);
      transform: scale(1);
    }
    50% {
      box-shadow:
        0 24px 70px rgba(0,0,0,0.4),
        0 2px 10px rgba(0,0,0,0.2),
        inset 0 1.5px 1px rgba(255,255,255,0.95),
        inset 0 -1.5px 2px rgba(255,255,255,0.2),
        inset 0 0 50px rgba(255,255,255,0.1);
      transform: scale(1.008);
    }
  }

  .glass-bar h1 {
    color: #ffffff;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 600;
    letter-spacing: 0.5px;
    line-height: 1.4;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
  }

  .glass-bar .subtext {
    margin-top: 14px;
    color: rgba(255, 255, 255, 0.75);
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 400;
  }

  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }
</style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="glass-wrap">
    <div class="glass-bar">
      <div class="glass-rim"></div>
      <h1>The Site is being updated<br>and will release Soon</h1>
      <div class="subtext">Please check back shortly</div>
      <div class="dots" style="margin-top:22px;">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

</body>
</html>
